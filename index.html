<style>
:root{--bg:#160a2e;--bg2:#2b1150;--org:#ff8a1f;--cream:#f8ecd0;--ink:#3b1f12;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:linear-gradient(var(--bg),var(--bg2) 60%,#4a1a55) fixed;color:#fff;font-family:Quicksand,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#stars{position:fixed;inset:0}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.bat{position:fixed;left:-70px;width:46px;height:20px;fill:#05020c;z-index:3;pointer-events:none;animation:fly 17s linear infinite,flap .22s ease-in-out infinite alternate}
@keyframes fly{from{translate:0 0}50%{translate:50vw -34px}to{translate:calc(100vw + 140px) 24px}}
@keyframes flap{to{scale:1 .45}}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;gap:6px;transition:opacity 1s,visibility 1s}
#intro.out{opacity:0;visibility:hidden}
.mini-moon{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe0,#fff3c4 55%,#e9d58f);box-shadow:0 0 50px 14px rgba(255,236,160,.35);margin-bottom:18px}
h1{font:400 clamp(2.7rem,12vw,5.4rem)/1.02 Creepster,'Trebuchet MS',cursive;color:var(--org);margin:0;text-shadow:0 0 22px rgba(255,138,31,.55),0 3px 0 #5a1d00}
#intro p{margin:10px 0 26px;font-size:1.1rem;color:#e4d3ff;max-width:30ch;line-height:1.5}
.btn{font:700 1.1rem Quicksand,sans-serif;padding:.9em 1.9em;border-radius:99px;border:2px solid var(--org);background:rgba(255,138,31,.14);color:#ffe0b8;cursor:pointer;animation:pulse 2.2s infinite;touch-action:manipulation}
.btn:hover,.btn:focus-visible{background:var(--org);color:#2a0f00;outline:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,31,.5)}50%{box-shadow:0 0 0 14px rgba(255,138,31,0)}}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0007;color:#fff;font-size:1.15rem;display:none;cursor:pointer}
#scene{position:fixed;inset:0 0 env(safe-area-inset-bottom,0px) 0;z-index:2;opacity:0;visibility:hidden;transition:opacity 1.4s}
#scene.on{opacity:1;visibility:visible}
#scene svg{display:block;width:100%;height:100%;overflow:visible}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;padding:0 64px;text-align:center;z-index:4;font-weight:700;color:#ffd9a8;text-shadow:0 2px 8px #000;pointer-events:none;min-height:1.5em}
.pumpkin{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s}
.pumpkin:hover{transform:scale(1.07)}
.pumpkin:focus-visible .hit{stroke:#ffd9a8;stroke-dasharray:5 5}
.ov{fill:#10051c;stroke:none;opacity:.64;transition:opacity .9s;pointer-events:none}
.lit .ov{opacity:0}
.lt{fill:#ffe27a;opacity:0;transition:opacity .9s}
.lit .lt{opacity:1}
.dk{fill:#12060a}
.halo{opacity:0;transition:opacity .9s;pointer-events:none}
.lit .halo{opacity:1;animation:flick 2.3s infinite}
.pumpkin:not(.lit) .bd{animation:beckon 2.6s ease-in-out infinite}
@keyframes flick{50%{opacity:.6}}
@keyframes beckon{50%{opacity:.78}}
.trail{fill:none;stroke:#ffb15c;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:1;transition:opacity 1.3s}
.go .trail{animation:draw 2s ease-in forwards}
.fade .trail{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
#ghost{transform-box:fill-box;transform-origin:50% 60%;opacity:0;transform:scale(.15);transition:opacity 1s,transform 1.1s cubic-bezier(.2,.9,.3,1.3)}
#ghost.show{opacity:1;transform:none}
.bob{transform-box:fill-box}
.show .bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wv{transform-box:fill-box;transform-origin:50% 100%;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(-24deg)}}
#bubble,#env{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transform:scale(.3);pointer-events:none;transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1.4)}
#bubble.show,#env.show{opacity:1;transform:none}
#env.show{pointer-events:auto;cursor:pointer;outline:none}
#env:hover .bob{filter:drop-shadow(0 0 8px #ffb15c)}
.flap{transform-box:fill-box;transform-origin:50% 0;transition:transform .6s .45s,opacity .2s .45s}
.seal{transition:opacity .3s .9s}
.pap{opacity:0;transition:transform .5s,opacity .3s .35s}
#env.open .flap{transform:scaleY(-1);opacity:0;transition:transform .5s,opacity .2s .4s}
#env.open .seal{opacity:0;transition:opacity .25s}
#env.open .pap{opacity:1;transform:translateY(-32px);transition:transform .7s .5s cubic-bezier(.2,.9,.3,1.1),opacity .25s .4s}
#env.out .pap{opacity:0;transition:opacity .25s}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#letter{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(8,3,18,.84);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
#letter.on{opacity:1;visibility:visible}
.paper{width:min(100%,520px);max-height:88vh;max-height:88dvh;overflow:auto;padding:30px 26px 24px;border-radius:6px;color:var(--ink);font-family:Caveat,'Segoe Script',cursive;background:radial-gradient(circle at 18% 8%,#fff7de,transparent 60%),var(--cream);box-shadow:0 0 0 6px #c9a66b55,0 20px 60px #000a,0 0 70px rgba(255,138,31,.3);opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.1) rotate(-12deg);transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .3s .6s}
#letter.on .paper{opacity:1;transform:none;transition:transform 1s cubic-bezier(.2,.9,.3,1.12),opacity .3s}
.paper h2{font:400 clamp(2rem,9vw,2.6rem)/1.1 Creepster,cursive;color:#b34700;margin:0 0 6px;text-align:center}
.deco{text-align:center;font-size:1.3rem;letter-spacing:.4em}
.paper p{font-size:1.5rem;line-height:1.45;margin:.6em 0;opacity:0;animation:rise .9s forwards;animation-delay:calc(var(--i)*.6s + 1.2s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sign{text-align:right;font-size:1.7rem;font-weight:700;color:#a3123a;margin-top:10px}
.paper .btn{display:block;margin:20px auto 0;color:#7a2d00;border-color:#b34700;background:#b3470018;animation:none;font-size:1rem}
.mh{transform-box:fill-box;transform-origin:center;animation:mh 6s ease-in-out infinite}
@keyframes mh{50%{transform:scale(1.08);opacity:.7}}
.fog{animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translateX(36px)}}
.ff{animation:ff 6s ease-in-out infinite}
@keyframes ff{0%,100%{opacity:0;transform:translate(0,0)}25%,75%{opacity:1}50%{transform:translate(16px,-20px)}}
.rh{opacity:0;animation:rh 5s ease-out infinite}
@keyframes rh{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.9}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}
.bh{position:fixed;z-index:35;font-size:1.25rem;pointer-events:none;animation:bh 1.8s ease-out both}
@keyframes bh{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.3)}}
.paper{animation:candle 3s ease-in-out infinite}
@keyframes candle{50%{box-shadow:0 0 0 6px #c9a66b55,0 20px 60px #000a,0 0 95px rgba(255,138,31,.45)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px">Activa JavaScript para encender las calabazas y abrir tu carta de Halloween 🎃</p></noscript>

<script>
/* ✏️ EDITA AQUÍ TU MENSAJE: cambia el nombre, los párrafos y la firma. */
const CARTA = {
  para: "mi princesita",
  mensaje: [
    "Dicen que Halloween es una noche llena de magia, pero creo que la verdadera magia está en esas personitas que llegan a nuestra vida y, sin hacer demasiado ruido, terminan convirtiéndose en alguien indispensable. Para mí, esa personita sos vos.",
    "Me encanta tenerte en mi vida, compartir mis días con vos y descubrir en cada pequeño detalle lo afortunado que soy. Tu forma de ser, tus cariños y todo lo que compartís conmigo tienen un valor enorme para mí.",
    "Quizás no siempre encuentre las palabras para demostrarte cuánto valoro todo lo que hacés por mí, pero quiero que nunca dudes de lo especial que sos en mi vida. Incluso en mis días más oscuros, siempre conseguís ser esa lucecita que hace que todo se sienta un poquito mejor.",
    "Te quiero muchísimo, mi princesa. Gracias por ser vos, por tu cariño y por hacer de mi mundo un lugar más bonito."
  ],
  firma: "Tu pichonsito favorito 🧡"
};

const $ = id => document.getElementById(id);
$('nom').textContent = CARTA.para;

/* Estrellas */
const st = $('stars');
for (let i = 0; i < 70; i++) {
  const s = document.createElement('i'), z = Math.random() * 2.4 + .8;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*70}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*4}s`;
  st.appendChild(s);
}

/* Calabazas */
const PK = `<circle class="halo" r="85" cy="-5" fill="url(#hl)"/>
<use class="bd" href="#shape" fill="#ff8a1f" stroke="#7a3300" stroke-width="2"/>
<path d="M-4-34Q-2-50 9-52l3 7q-6 2-5 11z" fill="#2e4a1f"/>
<use class="ov" href="#shape"/>
<use class="dk" href="#face"/>
<use class="lt" href="#face" filter="url(#glow)"/>
<circle class="hit" r="58" cy="-6" fill="transparent" stroke="transparent" stroke-width="2"/>`;
const lit = new Set(), notes = { p1: 69, p2: 72, p3: 76 };
document.querySelectorAll('.pumpkin').forEach(p => {
  p.innerHTML = PK;
  p.addEventListener('click', () => light(p));
  p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); light(p); } });
});
const hint = $('hint');
function light(p) {
  if (p.classList.contains('lit')) return;
  p.classList.add('lit'); lit.add(p.id); chime(notes[p.id]);
  hint.textContent = lit.size < 3 ? `Calabazas encendidas: ${lit.size} de 3` : '';
  if (lit.size === 3) summon();
}
function summon() {
  setTimeout(() => {
    $('scene').classList.add('go');
    setTimeout(() => { $('scene').classList.add('fade'); $('ghost').classList.add('show'); whoo(); }, 2100);
    setTimeout(() => { $('bubble').classList.add('show'); $('env').classList.add('show'); hint.textContent = 'Toca el sobre ✉️'; }, 3300);
  }, 700);
}

/* Sobre y carta */
const env = $('env'), letter = $('letter');
function openLetter() {
  if (busy) return; busy = true;
  hint.textContent = ''; env.classList.add('open'); burst();
  setTimeout(() => {
    $('ltitle').textContent = 'Para ti, ' + CARTA.para;
    const b = $('lbody'); b.textContent = '';
    CARTA.mensaje.forEach((t, i) => { const p = document.createElement('p'); p.style.setProperty('--i', i); p.textContent = t; b.appendChild(p); });
    const s = $('lsign'); s.style.setProperty('--i', CARTA.mensaje.length); s.textContent = CARTA.firma;
    const pp = document.querySelector('.paper'), r = env.getBoundingClientRect();
    pp.style.setProperty('--dx', (r.left + r.width / 2 - innerWidth / 2) + 'px');
    pp.style.setProperty('--dy', (r.top + r.height / 2 - innerHeight / 2) + 'px');
    void pp.offsetWidth;
    env.classList.add('out'); letter.classList.add('on'); chime(76); busy = false;
  }, 1500);
}
let busy = false;
function closeLetter() {
  if (!letter.classList.contains('on')) return;
  busy = true; letter.classList.remove('on');
  setTimeout(() => env.classList.remove('out'), 650);
  setTimeout(() => { env.classList.remove('open'); chime(69); }, 1150);
  setTimeout(() => { hint.textContent = 'Toca el sobre para volver a leerla 💌'; busy = false; }, 1900);
}
function burst() {
  const r = env.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const h = document.createElement('span'); h.className = 'bh'; h.textContent = i % 3 ? '🧡' : '💜';
    h.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;--x:${(Math.random() - .5) * 240}px;--y:${-60 - Math.random() * 170}px;animation-delay:${i * .06}s`;
    document.body.appendChild(h); setTimeout(() => h.remove(), 2400);
  }
}
env.addEventListener('click', openLetter);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });
$('close').onclick = closeLetter;
letter.addEventListener('click', e => { if (e.target === letter) closeLetter(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });

/* Música de fondo (sintetizada, sin archivos externos) */
let ac, bus, master, timer, nextT = 0, step = 0, musicOn = true;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [[57,60,64],[53,57,60],[52,56,59],[57,60,64]];
const ML = [81,0,76, 77,0,72, 76,0,80, 81,0,0];
function tone(f, t, d, type, v) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .05);
}
function sched() {
  while (nextT < ac.currentTime + .4) {
    const c = CH[Math.floor(step / 3) % 4], b = step % 3;
    if (b === 0) tone(mtof(c[0] - 12), nextT, 1.7, 'sine', .35);
    else tone(mtof(c[b] + 12), nextT, 1.1, 'triangle', .15);
    const m = ML[step % 12]; if (m) tone(mtof(m), nextT, 1.4, 'sine', .11);
    step++; nextT += .55;
  }
}
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  bus = ac.createGain(); bus.connect(master);
  const dl = ac.createDelay(); dl.delayTime.value = .38;
  const fb = ac.createGain(); fb.gain.value = .35;
  bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);
  [110, 164.8].forEach(f => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = .035; o.connect(g); g.connect(master); o.start(); });
}
function music(on) {
  try {
    if (!ac) initAudio();
    if (on) {
      ac.resume(); master.gain.setTargetAtTime(.5, ac.currentTime, .4);
      if (!timer) { nextT = ac.currentTime + .1; timer = setInterval(sched, 120); }
    } else {
      master.gain.setTargetAtTime(0, ac.currentTime, .2);
      clearInterval(timer); timer = null;
    }
  } catch (e) {}
}
function chime(m) { if (ac && musicOn) { tone(mtof(m), ac.currentTime, 1.3, 'sine', .25); tone(mtof(m + 12), ac.currentTime + .08, 1, 'triangle', .12); } }
function whoo() {
  if (!ac || !musicOn) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(520, t + .5); o.frequency.exponentialRampToValueAtTime(300, t + 1.2);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .3); g.gain.linearRampToValueAtTime(0, t + 1.3);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.4);
}
$('mute').onclick = () => {
  musicOn = !musicOn; music(musicOn);
  $('mute').textContent = musicOn ? '🔊' : '🔇';
  $('mute').setAttribute('aria-pressed', musicOn);
};
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (musicOn) ac.resume();
});

/* Entrar */
$('go').onclick = () => {
  music(true);
  $('mute').style.display = 'block';
  $('intro').classList.add('out');
  setTimeout(() => { $('scene').classList.add('on'); hint.textContent = 'Toca las calabazas para encenderlas 🎃'; }, 500);
};
</script>
